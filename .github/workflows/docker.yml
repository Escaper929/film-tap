name: 构建镜像

# 这个仓库不是网站了 —— 它只是一个容器镜像的源。
# push 到 main 就出镜像，NAS 上的 watchtower 会把新镜像拉下来重建容器。
#
# 三道门，缺一不可：
#   ① 构建**之前**跑 node _selftest.js。它是这里唯一能发现
#      「改了 index.html 却忘了同步 sw.js 的 SHELL_FP」的地方 ——
#      那个错漏会让线上是新版、手机上永远停在旧版，而且**不报任何错**。
#      自检不过就根本不构建，宁可没有新镜像。
#   ② 构建之后再拿真镜像起一个容器，走一遍「探活 → 设密码 → 登录 → 存 → 读 → 未登录 401」。
#      这一步能抓到 COPY 漏了文件（镜像起不来）、或者 .dockerignore
#      手滑把 server.py 挡掉这类事故 —— 光看构建成功是看不出来的。
# ③ **构建推的是不可变的 sha 标签**；latest 和版本 tag 要等②过了才指过去。
#      反过来做的话，坏镜像会先一步挂在可部署的标签上，watchtower 一小时后就把它拉下来了。
#
# 推到 Docker Hub（公开仓库），不是 GHCR —— 因为 NAS 那边要拉得到。
# 需要仓库里两个 secret：DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
# （Settings → Secrets and variables → Actions）。token 在 Docker Hub 的
# Account settings → Personal access tokens 建，权限给 Read & Write 就够。
# 少任何一个，登录那一步就会失败 —— 失败在这里是好事：宁可没有新镜像，
# 也不要一个推不上去、NAS 又拉不到的空欢喜。
#
# 下面这些 action 一律取大版本标签，且都要求 runner ≥ v2.327.1 —— 它们的
# 默认运行时是 Node 24（GitHub 托管的 ubuntu-latest 早就满足）。升大版本时
# 留意 setup-node v5 起「有 packageManager 字段就自动开缓存」这条：这个仓库
# 没有 package.json，所以不会触发。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/liritian/film-tap

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # ① 自检。PR 上只跑到这儿就够 —— 没必要为一次改动烧一个镜像。
      - name: 自检（结构 / 指纹 / 凭据护栏）
        run: node _selftest.js

      - uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 只出一个**不可变**的 sha 标签。latest 和版本 tag 要等冒烟过了才指过去 ——
      # 否则坏镜像会先一步挂在可部署的标签上，watchtower 那一小时后就把它拉下来了。
      - name: 算标签（只出 sha）
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short

      - name: 构建并推送
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # PR 也要能验证镜像真的能用，所以本地构建一份（不推）。
      - name: 构建（仅本地，PR 用）
        id: build_local
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: film-tap:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ② 拿真镜像跑一遍完整流程。这一步才是「镜像能用」的证据。
      #    ⚠️ 判定一律用 shell 的 case，不要写成 curl | grep -q：
      #       grep -q 一命中就关管道，curl 那边拿到 EPIPE 报
      #       “(23) Failure writing output to destination”，配合 set -o pipefail
      #       会让一个**其实通过了**的断言变成失败。这个坑踩过。
      - name: 冒烟 —— 真镜像起容器，探活 / 设密码 / 登录 / 存 / 读
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -n "${DIGEST:-}" ]; then
            IMG="${IMAGE}@${DIGEST}"
          else
            IMG="film-tap:pr"
          fi
          echo "被测镜像：$IMG"

          # 只挂一个匿名卷，不挂宿主机目录 —— 要验的就是「镜像自己装得下」
          docker run -d --name smoke -p 18300:8300 "$IMG"

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18300/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done

          H=$(curl -fsS http://127.0.0.1:18300/api/health)
          echo "health: $H"
          case "$H" in *'"app": "film-tap"'*) ;; *)
            echo "✗ 探活没有自报 film-tap，别的东西占了这个端口？"; exit 1;; esac
          # 镜像里 FT_ASSUME_HTTPS=1 是默认值 —— 部署形态永远是反代后面，
          # 少给这一条 cookie 就没有 Secure。
          case "$H" in *'"https": true'*) ;; *)
            echo "✗ https 字段是 false，会话 cookie 不会带 Secure"; exit 1;; esac

          # 设密码：非交互模式下它会读两行同样的密码
          printf 'smoke-password\nsmoke-password\n' \
            | docker exec -i smoke python3 /app/server.py --set-password

          H2=$(curl -fsS http://127.0.0.1:18300/api/health)
          case "$H2" in *'"configured": true'*) ;; *)
            echo "✗ 设完密码 configured 还是 false"; exit 1;; esac

          LOGIN=$(curl -fsS -c /tmp/jar -X POST http://127.0.0.1:18300/api/login \
            -H 'Content-Type: application/json' -d '{"password":"smoke-password"}')
          case "$LOGIN" in *'"ok": true'*) ;; *) echo "✗ 登录没成功：$LOGIN"; exit 1;; esac

          PUT=$(curl -fsS -b /tmp/jar -X PUT http://127.0.0.1:18300/api/data \
            -H 'Content-Type: application/json' \
            -d '{"data":{"cameras":{"m6":{"id":"m6","name":"冒烟"}}}}')
          case "$PUT" in *'"ok": true'*) ;; *) echo "✗ 写入没成功：$PUT"; exit 1;; esac

          GOT=$(curl -fsS -b /tmp/jar http://127.0.0.1:18300/api/data)
          case "$GOT" in *'"m6"'*) ;; *) echo "✗ 读回来没有 m6：$GOT"; exit 1;; esac

          # 静态页面也在镜像里（server.py 之外那三个文件）
          PAGE=$(curl -fsS http://127.0.0.1:18300/)
          case "$PAGE" in *'id="app"'*) ;; *) echo "✗ 首页里没有 #app"; exit 1;; esac
          SWH=$(curl -fsS http://127.0.0.1:18300/sw.js)
          case "$SWH" in *SHELL_FP*) ;; *) echo "✗ sw.js 里没有 SHELL_FP"; exit 1;; esac

          # 没登录拿不到数据（护住数据的底线）
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18300/api/data)
          echo "未登录读数据：$code"
          [ "$code" = "401" ]

          docker logs smoke
          docker rm -f smoke

      # ③ 冒烟过了才把可部署的标签指过去。imagetools create 是服务端复制
      #    manifest，不重新构建、不重传层，所以这一步基本是瞬时的。
      - name: 冒烟过了 —— 把 latest / 版本 tag 指到这个摘要
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "→ ${IMAGE}:latest"
            docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}@${DIGEST}"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "→ ${IMAGE}:${GITHUB_REF_NAME}"
            docker buildx imagetools create -t "${IMAGE}:${GITHUB_REF_NAME}" "${IMAGE}@${DIGEST}"
          fi
          docker buildx imagetools inspect "${IMAGE}:latest" 2>/dev/null || true

      - name: 失败时把容器日志捞出来
        if: failure()
        run: docker logs smoke || true
